        let currentColor = '#000000';
        let canvasBgColor = '#ffffff';

        let undoHistory = [];
        const maxUndoSteps = 15;

        // Auto Save Sender Handle

            document.getElementById('senderNameInput').value = savedSender;
        }

        // Initialize Canvas Dimensions
        function initCanvas() {
            const rect = canvas.getBoundingClientRect();
            // High DPI support
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            // Fill Canvas with Selected Background
            ctx.fillStyle = canvasBgColor;
            ctx.fillRect(0, 0, rect.width, rect.height);
            saveCanvasState();
        }

        // Change Canvas Background Color
        window.setCanvasBg = function(color) {
            canvasBgColor = color;
            document.getElementById('bgCustomColorPicker').value = color;

            const rect = canvas.getBoundingClientRect();
            // Save contents before repainting background
            const tempImg = new Image();
            tempImg.src = canvas.toDataURL();
            tempImg.onload = function() {
                ctx.fillStyle = canvasBgColor;
                ctx.fillRect(0, 0, rect.width, rect.height);
                ctx.drawImage(tempImg, 0, 0, rect.width, rect.height);
                saveCanvasState();
            };
        };

        document.getElementById('bgCustomColorPicker').addEventListener('input', (e) => {
            setCanvasBg(e.target.value);
        });

        window.addEventListener('resize', () => {
            // Re-init canvas preserving drawing if needed
        });

        // Canvas Drawing Handlers
        function saveCanvasState() {
            if (undoHistory.length >= maxUndoSteps) undoHistory.shift();
            undoHistory.push(canvas.toDataURL());
        }

        window.undoCanvas = function() {
            if (undoHistory.length > 1) {
                undoHistory.pop(); // remove current state
                const previousState = undoHistory[undoHistory.length - 1];
                const img = new Image();
                img.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.getBoundingClientRect().width, canvas.getBoundingClientRect().height);
                };
                img.src = previousState;
            }
        };

        window.clearCanvas = function() {
            const rect = canvas.getBoundingClientRect();
            ctx.fillStyle = canvasBgColor;
            ctx.fillRect(0, 0, rect.width, rect.height);
            saveCanvasState();
        };

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getCanvasCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getCanvasCoordinates(e);

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'eraser') {
                ctx.strokeStyle = canvasBgColor;
            } else {
                ctx.strokeStyle = currentColor;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
                saveCanvasState();
            }
        }

        // Attach Canvas Touch & Mouse Events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // Tool Settings
        window.setTool = function(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            if (tool === 'brush') document.getElementById('brushBtn').classList.add('active');
            if (tool === 'eraser') document.getElementById('eraserBtn').classList.add('active');
        };

        window.setColor = function(color) {
            currentColor = color;
            setTool('brush');
            document.getElementById('customColorPicker').value = color;
        };

        document.getElementById('customColorPicker').addEventListener('input', (e) => {
            setColor(e.target.value);
        });

        document.getElementById('brushSize').addEventListener('input', (e) => {
            brushSize = e.target.value;
        });

        // Select Member
        window.selectMember = function(member) {
            selectedMember = member;
            document.querySelectorAll('.member-btn').forEach(btn => {
                btn.className = 'member-btn px-3 py-2 rounded-xl text-xs font-bold border border-white/10 opacity-70 hover:opacity-100 transition-all text-center';
            });
            event.target.className = 'member-btn active px-3 py-2 rounded-xl text-xs font-bold border border-rose-500 bg-rose-500/20 text-rose-500 transition-all text-center';
        };

        // Theme Switcher
        window.setTheme = function(themeName) {
            document.documentElement.className = `theme-${themeName}`;
        };

        // Submit Drawing to Firebase Realtime Database
        window.submitDrawing = function() {
            const senderName = document.getElementById('senderNameInput').value.trim();
            const note = document.getElementById('noteInput').value.trim();
            const submitBtn = document.getElementById('submitDrawingBtn');

            if (!senderName) {
                alert('Lütfen isminizi veya kullanıcı adınızı girin!');
                return;
            }

            localStorage.setItem('crusher_sender_name', senderName);

            // Compress / Get Image Data URL from Canvas
            const imageDataUrl = canvas.toDataURL('image/png', 0.85);

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Buluta Yükleniyor...';

            push(ref(db, 'drawings'), {
                senderName: senderName,
                targetMember: selectedMember,
                imageDataUrl: imageDataUrl,
                note: note,
                likes: 0,
                timestamp: Date.now(),
                dateStr: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }).then(() => {
                document.getElementById('noteInput').value = '';
                clearCanvas();
            }).catch((err) => {
                alert("Yükleme hatası: " + err.message);
            }).finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Buluta Gönder & Paylaş';
            });
        };

        // Like Drawing
        window.likeDrawing = function(drawingId) {
            const likesRef = ref(db, `drawings/${drawingId}/likes`);
            runTransaction(likesRef, (currentLikes) => {
                return (currentLikes || 0) + 1;
            });
        };

        // Filter Stream
        window.filterDrawings = function(member, btnEl) {
            activeFilter = member;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.className = 'filter-btn px-3 py-1 rounded-full app-input text-xs font-semibold whitespace-nowrap opacity-80 hover:opacity-100';
            });
            btnEl.className = 'filter-btn active px-3 py-1 rounded-full bg-rose-600 text-white text-xs font-bold whitespace-nowrap';
            renderGallery();
        };

        // Lightbox Functions
        window.openLightbox = function(imgSrc, sender, target, note) {
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('lightboxMeta').innerHTML = `
                <div class="font-bold text-lg">${escapeHtml(sender)} ➔ <span class="text-rose-500">${escapeHtml(target)}</span></div>
                <div class="text-xs opacity-75 mt-1">${escapeHtml(note || '')}</div>
            `;
            document.getElementById('lightboxModal').classList.remove('hidden');
        };

        window.closeLightbox = function() {
            document.getElementById('lightboxModal').classList.add('hidden');
        };

        // Realtime Listener
        const drawingsRef = ref(db, 'drawings');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        onValue(drawingsRef, (snapshot) => {
            statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500";
            statusText.innerText = "Canlı Bulut";

            const data = snapshot.val();
            if (!data) {
                allDrawings = [];
            } else {
                allDrawings = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            }

            renderGallery();
        }, () => {
            statusDot.className = "w-2 h-2 rounded-full bg-rose-500";
            statusText.innerText = "Bağlantı Kesildi";
        });

        function renderGallery() {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';

            let filtered = allDrawings;
            if (activeFilter !== 'ALL') {
                filtered = allDrawings.filter(d => d.targetMember === activeFilter);
            }

            document.getElementById('drawingCount').innerText = `${filtered.length} Çizim`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 app-card rounded-2xl">
                        <i class="fa-solid fa-paint-brush text-3xl text-rose-500/50 mb-2 block"></i>
                        <p class="font-medium text-xs opacity-70">Henüz bu kategori için çizim yapılmadı.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'app-card p-4 rounded-2xl space-y-3 relative transition-transform hover:-translate-y-0.5';
                
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                            <span class="font-bold text-xs">${escapeHtml(item.senderName)}</span>
                        </div>
                        <span class="px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-500 text-[10px] font-extrabold border border-rose-500/30">
                            ${escapeHtml(item.targetMember)}
                        </span>
                    </div>

                    <div onclick="openLightbox('${item.imageDataUrl}', '${escapeHtml(item.senderName)}', '${escapeHtml(item.targetMember)}', '${escapeHtml(item.note || '')}')" 
                        class="w-full bg-white rounded-xl overflow-hidden cursor-pointer shadow-inner border border-black/5 flex items-center justify-center p-2 group">
                        <img src="${item.imageDataUrl}" class="max-h-52 w-auto object-contain group-hover:scale-105 transition-transform" alt="Fan Art">
                    </div>

                    ${item.note ? `<p class="text-xs opacity-80 italic">"${escapeHtml(item.note)}"</p>` : ''}

                    <div class="flex items-center justify-between pt-2 border-t border-black/5 dark:border-white/5 text-xs">
                        <span class="text-[10px] opacity-60">${item.dateStr || ''}</span>
                        <button onclick="likeDrawing('${item.id}')" class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 font-bold transition-all active:scale-95">
                            <i class="fa-solid fa-utensils"></i>
                            <span>Çatalla (${item.likes || 0})</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Init Canvas on page load
        window.addEventListener('load', () => {
            initCanvas();
        });
    </script>
</body>
</html>
